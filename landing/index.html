  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f4f1;
      color: #1a1a1a;
      overflow-x: hidden;
    }


    /* ── Marquee ── */
    @keyframes marquee-left {
      from { transform: translateX(0); }
      to   { transform: translateX(-25%); }
    }
    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee-left 28s linear infinite;
    }
    .marquee-track:hover { animation-play-state: paused; }

    /* ── Scroll ring ── */
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ── Counter ── */
    @keyframes count-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Fade in ── */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fade-up 0.7s ease forwards; }
    .fade-up-1 { animation-delay: 0.1s; opacity: 0; }
    .fade-up-2 { animation-delay: 0.25s; opacity: 0; }
    .fade-up-3 { animation-delay: 0.4s; opacity: 0; }

const { useState, useEffect, useRef } = React;

/* ── Tweaks defaults ── */

  "ctaText": "Únete al Equipo"
} /*EDITMODE-END*/;

/* ── Animated counter ── */
function useCounter(target, duration = 1800) {
  const [val, setVal] = useState(0);
  const ref = useRef(null);
  useEffect(() => {
    const observer = new IntersectionObserver(([entry]) => {
      if (!entry.isIntersecting) return;
      observer.disconnect();
      let start = null;
      const step = (ts) => {
        if (!start) start = ts;
        const p = Math.min((ts - start) / duration, 1);
        const ease = 1 - Math.pow(1 - p, 3);
        setVal(Math.floor(ease * target));
        if (p < 1) requestAnimationFrame(step);
      };
      requestAnimationFrame(step);
    }, { threshold: 0.3 });
    if (ref.current) observer.observe(ref.current);
    return () => observer.disconnect();
  }, [target, duration]);
  return [val, ref];
}

/* ── Nav ── */
function Nav({ primary, secondary, bg }) {
  const [scrolled, setScrolled] = useState(false);
  const [isDark, setIsDark] = useState(() => {
    return document.documentElement.getAttribute('data-theme') === 'dark';
  });

  useEffect(() => {
    const fn = () => setScrolled(window.scrollY > 20);
    window.addEventListener('scroll', fn);
    return () => window.removeEventListener('scroll', fn);
  }, []);

  const toggleTheme = () => {
    const next = isDark ? 'light' : 'dark';
    document.documentElement.setAttribute('data-theme', next);
    localStorage.setItem('dt_theme', next);
    setIsDark(!isDark);
  };

  const links = [
    { label: 'Inicio', href: '#inicio' },
    { label: 'Sobre Nosotros', href: '#sobre-nosotros' },
    { label: 'Proceso', href: '#como-trabajamos' },
    { label: 'Únete al Equipo', href: '#unete' },
  ];

  return (
    <nav style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
      background: scrolled ? 'var(--bg-navbar)' : 'transparent',
      backdropFilter: scrolled ? 'blur(16px)' : 'none',
      borderBottom: scrolled ? '1px solid var(--border-color)' : 'none',
      transition: 'all 0.35s ease'
    }}>
      <div style={{
        maxWidth: 1280, margin: '0 auto', width: '100%',
        padding: scrolled ? '10px 40px' : '18px 40px',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between'
      }}>
      {/* Logo */}
      <div style={{ display: 'flex', alignItems: 'center' }}>
        <img src={(window.__resources && window.__resources.logoImg || "images/logoImg_nuevo.png") + "?v=3"} alt="DreamTeam" style={{ height: 75, width: 'auto', objectFit: 'contain', display: 'block' }} />
      </div>

      {/* Links */}
      {/* Nav pill */}
      <div style={{
          display: 'flex', gap: 2, alignItems: 'center',
          background: 'var(--glass-bg)',
          backdropFilter: 'blur(12px)',
          borderRadius: 100,
          padding: '5px 6px',
          border: '1px solid var(--glass-border)',
          boxShadow: '0 2px 12px rgba(0,0,0,0.06)', fontSize: "14px"
        }} data-comment-anchor="296348093c-div-73-7">
        {links.map((l) =>
          <a key={l.label} href={l.href} style={{
            fontFamily: 'DM Sans', fontWeight: 500,
            color: 'var(--text-main)', textDecoration: 'none', opacity: 0.72,
            padding: '5px 15px', borderRadius: 100,
            transition: 'opacity 0.2s, background 0.15s', fontSize: "14px"
          }}
          onMouseEnter={(e) => {e.currentTarget.style.opacity = 1;e.currentTarget.style.background = 'rgba(0,0,0,0.05)';}}
          onMouseLeave={(e) => {e.currentTarget.style.opacity = 0.72;e.currentTarget.style.background = 'transparent';}}>
            {l.label}
          </a>
          )}
      </div>

      {/* CTA & Theme Switch */}
      <div style={{ display: 'flex', gap: 12, alignItems: 'center' }}>
        {/* React Dynamic theme toggle button */}
        <div onClick={toggleTheme} style={{
          background: 'none', border: '1px solid var(--border-color)',
          width: '38px', height: '38px', borderRadius: '50%',
          cursor: 'pointer', display: 'flex', alignItems: 'center', justifyContent: 'center',
          color: 'var(--text-main)', transition: 'all 0.2s ease'
        }} onMouseEnter={(e) => {e.currentTarget.style.background = 'var(--border-color)';}}
           onMouseLeave={(e) => {e.currentTarget.style.background = 'none';}}
           aria-label="Alternar Tema">
          {isDark ? (
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block' }}>
              <circle cx="12" cy="12" r="5"></circle>
              <line x1="12" y1="1" x2="12" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="23"></line>
              <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
              <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
              <line x1="1" y1="12" x2="3" y2="12"></line>
              <line x1="21" y1="12" x2="23" y2="12"></line>
              <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
              <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
            </svg>
          ) : (
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{ display: 'block' }}>
              <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
            </svg>
          )}
        </div>

        <button style={{
            background: primary, color: 'white', border: 'none',
            borderRadius: 100, padding: '9px 22px',
            fontWeight: 600, cursor: 'pointer', fontFamily: 'DM Sans',
            transition: 'transform 0.2s, box-shadow 0.2s',
            boxShadow: `0 4px 16px ${primary}55`, fontSize: "14px"
          }}
          onMouseEnter={(e) => {e.target.style.transform = 'scale(1.04)';e.target.style.boxShadow = `0 6px 24px ${primary}77`;}}
          onMouseLeave={(e) => {e.target.style.transform = 'scale(1)';e.target.style.boxShadow = `0 4px 16px ${primary}55`;}} id="colaboradores-btn">Colaboradores
        </button>
      </div>
      </div>
    </nav>);

}

/* ── Scroll Ring ── */
function ScrollRing({ color }) {
  const text = 'SCROLL TO EXPLORE · SCROLL TO EXPLORE · ';
  const r = 38;
  const circumference = 2 * Math.PI * r;
  return (
    <div style={{ position: 'relative', width: 96, height: 96, flexShrink: 0 }}>
      <svg width="96" height="96" viewBox="0 0 96 96" style={{ animation: 'spin-slow 12s linear infinite' }}>
        <defs>
          <path id="circle-path" d={`M 48,48 m -${r},0 a ${r},${r} 0 1,1 ${r * 2},0 a ${r},${r} 0 1,1 -${r * 2},0`} />
        </defs>
        <text fill={color} fontSize="8.5" fontFamily="DM Sans" fontWeight="500" letterSpacing="2.5">
          <textPath href="#circle-path">{text}</textPath>
        </text>
      </svg>
      <div style={{
        position: 'absolute', inset: 0, display: 'flex', alignItems: 'center', justifyContent: 'center'
      }}>
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
          <path d="M10 4v12M4 10l6 6 6-6" stroke={color} strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round" />
        </svg>
      </div>
    </div>);

}

/* ── Hero Image Panel ── */
function HeroImage({ primary }) {
  const cardW = 320;
  const cardH = 420;
  const stackCards = [
  { rotate: -8, x: -5, y: 10, bg: primary, opacity: 0.22 },
  { rotate: -4, x: -2, y: 5, bg: primary, opacity: 0.48 }];

  return (
    <div style={{
      flex: '0 0 auto',
      width: cardW + 80,
      height: cardH + 80,
      position: 'relative',
      display: 'flex', alignItems: 'center', justifyContent: 'center',
      flexShrink: 0
    }}>
      {/* Stacked cards behind */}
      {stackCards.map((c, i) =>
      <div key={i} style={{
        position: 'absolute',
        width: cardW, height: cardH,
        borderRadius: 28,
        background: c.bg,
        opacity: c.opacity,
        transform: `rotate(${c.rotate}deg) translate(${c.x}px, ${c.y}px)`,
        transformOrigin: 'center bottom',
        transition: 'transform 0.45s cubic-bezier(0.34,1.56,0.64,1), opacity 0.45s ease'
      }} />
      )}

      {/* Main card — slightly tilted */}
      <div
        onMouseEnter={(e) => {
          const parent = e.currentTarget.parentNode;
          const cards = parent.querySelectorAll('div[style*="position: absolute"]');
          cards[0] && (cards[0].style.transform = 'rotate(-14deg) translate(-22px, 32px)');
          cards[1] && (cards[1].style.transform = 'rotate(-8deg) translate(-10px, 18px)');
          e.currentTarget.style.transform = 'rotate(-2deg) translateY(-6px)';
          e.currentTarget.style.boxShadow = `0 48px 100px rgba(0,0,0,0.28), 0 12px 32px ${primary}44`;
        }}
        onMouseLeave={(e) => {
          const parent = e.currentTarget.parentNode;
          const cards = parent.querySelectorAll('div[style*="position: absolute"]');
          cards[0] && (cards[0].style.transform = '');
          cards[1] && (cards[1].style.transform = '');
          e.currentTarget.style.transform = 'rotate(-4deg)';
          e.currentTarget.style.boxShadow = `0 32px 80px rgba(0,0,0,0.22), 0 8px 24px ${primary}30`;
        }}
        style={{
          position: 'relative',

          onMouseLeave={(e) => {e.currentTarget.parentNode.style.animationPlayState = 'running';}}>
            
              <img
              src={b.logo}
              alt={b.name}
              style={{ height: 80, width: 'auto', maxWidth: 180, objectFit: 'contain', display: 'block' }} />
              <span style={{
              fontFamily: 'DM Sans', fontWeight: 600, fontSize: 13,
              color: 'var(--text-main)', opacity: 0.9, whiteSpace: 'nowrap',
              textAlign: 'center'
            }}>{b.name}</span>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}
