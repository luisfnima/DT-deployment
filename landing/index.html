  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #f5f4f1;
      color: #1a1a1a;
      overflow-x: hidden;
    }


    /* ── Marquee ── */
    @keyframes marquee-left {
      from { transform: translateX(0); }
      to   { transform: translateX(-25%); }
    }
    .marquee-track {
      display: flex;
      width: max-content;
      animation: marquee-left 28s linear infinite;
    }
    .marquee-track:hover { animation-play-state: paused; }

    /* ── Scroll ring ── */
    @keyframes spin-slow {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ── Counter ── */
    @keyframes count-up {
      from { opacity: 0; transform: translateY(8px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Fade in ── */
    @keyframes fade-up {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    .fade-up { animation: fade-up 0.7s ease forwards; }
    .fade-up-1 { animation-delay: 0.1s; opacity: 0; }
    .fade-up-2 { animation-delay: 0.25s; opacity: 0; }
    .fade-up-3 { animation-delay: 0.4s; opacity: 0; }
    .fade-up-4 { animation-delay: 0.55s; opacity: 0; }
    .fade-up-5 { animation-delay: 0.7s; opacity: 0; }

    /* ── Image shimmer ── */
    @keyframes shimmer {
      0%,100% { opacity: 0.06; }
      50%      { opacity: 0.12; }
    }

    .section-inner {
      max-width: 1600px;
      margin: 0 auto;
      width: 100%;
    }
  </style>

<script>
window.addEventListener('load', function () {
  setTimeout(initScrollAnimations, 500);
});

function initScrollAnimations() {
  if (typeof gsap === 'undefined' || typeof ScrollTrigger === 'undefined') return;
  gsap.registerPlugin(ScrollTrigger);

  // Simple fade+slide-up for any element with data-reveal attribute
  // We'll use IntersectionObserver-style via ScrollTrigger on specific selectors

  // ── Ticker
  gsap.fromTo('[data-anim="ticker"]',
    { opacity: 0, y: 30 },
    { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out',
      scrollTrigger: { trigger: '[data-anim="ticker"]', start: 'top 90%', once: true }
    }
  );

  // ── Nosotros — solo el título y el grid completo (no cards individuales)
  gsap.fromTo('[data-anim="nosotros-label"]',
    { opacity: 0, y: 20 },
    { opacity: 1, y: 0, duration: 0.7, ease: 'power2.out',
      scrollTrigger: { trigger: '[data-anim="nosotros-label"]', start: 'top 85%', once: true }
    }
  );
  gsap.fromTo('[data-anim="nosotros-grid"]',
    { opacity: 0, y: 40 },
    { opacity: 1, y: 0, duration: 0.9, ease: 'power2.out',
      scrollTrigger: { trigger: '[data-anim="nosotros-grid"]', start: 'top 80%', once: true }
    }
  );

  // ── Cómo Trabajamos header
  gsap.fromTo('[data-anim="como-header"]',
    { opacity: 0, y: 36 },
    { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out',
      scrollTrigger: { trigger: '[data-anim="como-header"]', start: 'top 82%', once: true }
    }
  );
  // Step cards stagger
  gsap.fromTo('[data-anim="step-card"]',
    { opacity: 0, y: 50 },
    { opacity: 1, y: 0, duration: 0.85, ease: 'power3.out',
      stagger: 0.12,
      scrollTrigger: { trigger: '[data-anim="step-card"]', start: 'top 80%', once: true }
    }
  );

  // ── Brands
  gsap.fromTo('[data-anim="brands"]',
    { opacity: 0, y: 28 },
    { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out',
      scrollTrigger: { trigger: '[data-anim="brands"]', start: 'top 88%', once: true }
    }
  );

  // ── CTA content
  gsap.fromTo('[data-anim="cta-content"] > *',
    { opacity: 0, y: 44 },
    { opacity: 1, y: 0, duration: 0.9, ease: 'power3.out', stagger: 0.13,
      scrollTrigger: { trigger: '[data-anim="cta-content"]', start: 'top 75%', once: true }
    }
  );

  // ── Footer columns
  gsap.fromTo('[data-anim="footer-col"]',
    { opacity: 0, y: 32 },
    { opacity: 1, y: 0, duration: 0.8, ease: 'power2.out', stagger: 0.1,
      scrollTrigger: { trigger: '[data-anim="footer-col"]', start: 'top 88%', once: true }
    }
  );
}
</script>
